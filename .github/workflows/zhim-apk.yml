name: Build Zhim APK

on:
  push:
    paths:
      - "zhim-app/**"
      - ".github/workflows/zhim-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships the Android SDK (ANDROID_HOME);
      # android-actions/setup-android currently fails installing "tools".
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p zhim-app assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp zhim-app/app/build/outputs/apk/debug/app-debug.apk zhim-app/zhim.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhim-apk
          path: zhim-app/zhim.apk
          if-no-files-found: error

      # Keep a copy of the latest APK in the branch so it can be downloaded
      # directly (Actions artifacts come as a zip and expire after 90 days).
      - name: Commit APK to the branch
        if: github.event_name == 'push'
        run: |
          mkdir -p zhim-app/dist
          cp zhim-app/zhim.apk zhim-app/dist/zhim.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f zhim-app/dist/zhim.apk
          git commit -m "Build zhim.apk [skip ci]" || exit 0
          git push
