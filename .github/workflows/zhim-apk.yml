name: Build Zhim APK

on:
  push:
    paths:
      - "zhim-app/**"
      - ".github/workflows/zhim-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p zhim-app assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp zhim-app/app/build/outputs/apk/debug/app-debug.apk zhim-app/zhim.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhim-apk
          path: zhim-app/zhim.apk
          if-no-files-found: error
