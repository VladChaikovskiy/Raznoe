<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Жим ВТ/ЧТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first workout log — sticky header (cycle, weeks, day tabs), exercise cards with set chips, fixed footer action */
:root{
  --bg:#ecebe6; --card:#fbfaf7; --ink:#151515; --muted:#62656a; --line:#d5d3cc;
  --accent:#d0202a; --on-accent:#ffffff; --soft:#f7e2e1; --ok:#2f7a4c; --ok-soft:#e1efe6; --hdr:#151515; --hdr-fg:#f0efea;
  --display:"Barlow Condensed","Arial Narrow","sans-serif-condensed",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141516; --card:#1e2022; --ink:#f0efea; --muted:#9b9ea3; --line:#33363a;
  --accent:#e8414a; --on-accent:#ffffff; --soft:#3a2124; --ok:#5fb582; --ok-soft:#1c3326; --hdr:#0b0c0d; --hdr-fg:#f0efea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141516; --card:#1e2022; --ink:#f0efea; --muted:#9b9ea3; --line:#33363a;
  --accent:#e8414a; --on-accent:#ffffff; --soft:#3a2124; --ok:#5fb582; --ok-soft:#1c3326; --hdr:#0b0c0d; --hdr-fg:#f0efea; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-fg);padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:1px;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand span{color:var(--accent);margin:0 6px}
.brand small{font-size:15px;font-weight:700;opacity:.75;letter-spacing:.5px}
.hbtns{display:flex;gap:6px}
.hbtn{background:transparent;border:1.5px solid color-mix(in srgb,var(--hdr-fg) 40%,transparent);color:var(--hdr-fg);border-radius:6px;padding:5px 10px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.hbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row2{display:flex;align-items:center;gap:8px}
.cyc{display:flex;align-items:center;gap:2px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.cyc button{background:none;border:0;color:var(--hdr-fg);font-size:22px;line-height:1;padding:2px 6px}
.cyc button:disabled{opacity:.25;cursor:default}
.weeks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.wk{background:color-mix(in srgb,var(--hdr-fg) 12%,transparent);border:0;color:var(--hdr-fg);border-radius:5px;padding:6px 0;font-family:var(--display);font-weight:800;font-size:15px;position:relative}
.wk.cur{background:var(--hdr-fg);color:var(--hdr)}
.wk.ok::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tabs{display:grid;grid-template-columns:1fr 1fr .8fr}
.tab{background:none;border:0;border-bottom:4px solid transparent;color:var(--hdr-fg);opacity:.6;padding:6px 0 7px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:center;align-items:baseline;gap:6px}
.tab small{font-size:13px;font-weight:600;letter-spacing:1px;opacity:.8}
.tab.cur{opacity:1;border-bottom-color:var(--accent)}
.tab .chk{color:var(--ok);font-size:16px}

/* list */
.list{display:flex;flex-direction:column;gap:10px;padding-block:14px 120px}
.ex{background:var(--card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent}
.ex.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 55%,var(--card))}
.ex.main{border-left:5px solid var(--accent)}
.exh{display:flex;gap:10px;align-items:flex-start}
.num{font-family:var(--display);font-weight:900;font-size:22px;color:var(--accent);min-width:18px;line-height:1.05}
.t{flex:1;min-width:0}
.t h3{margin:0;font-size:16px;font-weight:700;line-height:1.2}
.t p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.3}
.rest{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.exb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:17px;font-weight:700;margin-left:3px}
.sr{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--accent)}
.warm{font-size:12.5px;color:var(--muted);line-height:1.35}
.wt{display:flex;align-items:center;gap:6px}
.step{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);font-size:22px;font-weight:600;line-height:1}
.win{width:76px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-family:var(--display);font-weight:800;font-size:22px}
.wt span{font-family:var(--display);font-weight:700;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:46px;height:42px;border-radius:21px;border:2px solid var(--line);background:transparent;font-family:var(--display);font-weight:800;font-size:16px;padding:0 12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.test{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.test input{width:70px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-family:var(--display);font-weight:800;font-size:19px}
.est{font-weight:700;color:var(--ok)}

/* edit mode */
.ed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ed label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);min-width:0}
.ed label.w2{grid-column:span 3}
.ed input{height:38px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 9px;font:500 15px var(--body);min-width:0;width:100%}
.edbar{display:flex;gap:6px;justify-content:flex-end}
.mini{height:36px;padding:0 12px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.mini.danger{border-color:var(--accent);color:var(--accent)}
.mini.armed{background:var(--accent);color:var(--on-accent)}
.mini:disabled{opacity:.35;cursor:default}
.add{height:52px;border-radius:10px;border:2px dashed var(--line);background:transparent;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1.5px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.prog{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.primary{height:48px;padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.primary.ok{background:var(--ok)}
.ghost{height:48px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:14px}

/* settings */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .app{display:flex;flex-direction:column;gap:14px}
.shd{display:flex;justify-content:space-between;align-items:center}
.shd h2{margin:0;font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;letter-spacing:1px}
.box{background:var(--card);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:1px;text-transform:uppercase}
.box.hl{outline:3px solid var(--accent)}
.fld{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fld input{width:96px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;font-family:var(--display);font-weight:800;font-size:22px}
.hist{display:flex;flex-direction:column}
.hist button{display:flex;justify-content:space-between;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;font-size:14px}
.hist button span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.store{font-size:13px;color:var(--muted)}
.sschk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.sschk input{width:20px;height:20px;accent-color:var(--accent)}
.unit{display:flex;flex-direction:column;line-height:1.05}
.unit small{font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:.2px;text-transform:none;white-space:nowrap}
.sstag{font-size:13px;font-weight:600;color:var(--accent)}
.t p.ssp{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.feel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.feel span{margin-right:2px}
.feel button{height:34px;padding:0 11px;border-radius:17px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:13px}
.feel button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.feel button.on.f-e{background:var(--ok);border-color:var(--ok);color:#fff}
.feel button.on.f-n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on.r-e{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.on.r-h{background:var(--hdr);border-color:var(--hdr);color:var(--hdr-fg)}
.chip.on.r-h::after{content:"!";margin-left:1px}
/* rest timer */
.rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtb{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.rtb svg{width:17px;height:17px;flex:none}
.rtb svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rt.on{background:var(--hdr);color:var(--hdr-fg);border-radius:10px;padding:10px 12px;flex-wrap:nowrap}
.rt.on .tm{font-family:var(--display);font-weight:900;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;min-width:86px}
.rt.on .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:12px;opacity:.85}
.rt.on .trk{height:6px;border-radius:3px;background:color-mix(in srgb,var(--hdr-fg) 22%,transparent);overflow:hidden}
.rt.on .trk i{display:block;height:100%;background:var(--accent);width:100%}
.rt.on button{flex:none;height:36px;min-width:44px;padding:0 9px;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--hdr-fg) 35%,transparent);background:transparent;color:var(--hdr-fg);font-weight:700;font-size:13px}
.rt.fin{background:var(--ok);color:#fff;border-radius:10px;padding:10px 12px;justify-content:space-between;font-weight:700;font-size:15px}
.rt.fin button{height:36px;padding:0 12px;border-radius:7px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-weight:700;font-size:13px}
.pill{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--hdr);color:var(--hdr-fg);border:2px solid var(--accent);border-radius:22px;height:44px;padding:0 14px;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pill.fin{background:var(--ok);border-color:var(--ok);color:#fff}
.pill svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
/* dumbbell suggestion */
.sug{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--muted)}
.sug b{color:var(--ink)}
.sug button{flex:none;height:32px;padding:0 10px;border-radius:6px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:13px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.25}
.panel{background:var(--card);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{margin:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:1px;text-transform:uppercase}
.panel .cap{font-size:13px;color:var(--muted);margin:0;min-height:1.3em}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px var(--body)}
.chart .val{fill:var(--ink);font:700 12px var(--body)}
.chart .bar{fill:var(--accent)}
.chart .bar.sel{fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{font-size:14px;font-weight:600;line-height:1.25;min-width:0}
.exrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.exrow .dl{font-family:var(--display);font-weight:800;font-size:17px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.exrow .dl.up{color:var(--ok)}
.spark{width:72px;height:26px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.bk{width:100%;min-height:110px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:12px/1.3 ui-monospace,monospace;padding:8px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(136px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.row1>*,.row2>*{min-width:0}
@media (max-width:400px){
  .brand{font-size:20px}.brand small{font-size:13px}
  .hbtn{padding:5px 7px;font-size:12px;letter-spacing:.5px}
  .row2{gap:4px}.cyc{font-size:13px}.cyc button{padding:2px 3px;font-size:20px}
  .weeks{gap:3px}.wk{font-size:13px;padding:6px 0}
  .tab{font-size:16px;gap:4px}.tab small{display:none}
  .big{font-size:30px}.sr{font-size:19px}
  .step{width:36px;height:38px}.win{width:62px;height:38px;font-size:20px}
  .chip{min-width:40px;height:40px;padding:0 9px}
  .primary{font-size:16px;padding:0 12px}
}
@media (max-width:340px){.tab small{display:none}.brand small{display:none}.hbtn{font-size:11px;padding:4px 6px}}
@media (prefers-reduced-motion:no-preference){.chip,.ex{transition:background .15s,border-color .15s}}
</style>

<div id="root"></div>
<div id="toast" class="toast" hidden></div>
<button id="pill" class="pill" data-act="pill" hidden></button>

<script>
(function(){
"use strict";
var BENCH={
  benchTue:[{p:.795,s:4,r:5},{p:.818,s:5,r:4},{p:.864,s:5,r:3},{p:.909,s:3,r:2},{p:.682,s:3,r:5,tag:"разгрузка"},{test:true}],
  benchThu:[{p:.727,s:4,r:6},{p:.75,s:4,r:6},{p:.773,s:4,r:5},{p:.795,s:4,r:4},{p:.636,s:3,r:5,tag:"разгрузка"},{p:.636,s:3,r:5,tag:"легко после проверки"}]
};
var WARM={benchTue:[[0,10],[.4545,5],[.636,3],[.727,"1–2"]],benchThu:[[0,10],[.4545,5],[.59,3]]};
var DAYN={tue:"Вторник",thu:"Четверг"}, DAYS={tue:"ВТ",thu:"ЧТ"};
var LS="zhim-app-v1";

function uid(){return Math.random().toString(36).slice(2,9)}
function r25(x){return Math.round(x/2.5)*2.5}
function fmt(n){return (n===null||n===undefined||n==="")?"":String(+n).replace(".",",")}
function num(v){v=String(v).replace(",",".").trim();if(v==="")return null;var n=parseFloat(v);return isFinite(n)?n:null}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function dstr(iso){if(!iso)return"";var p=iso.slice(0,10).split("-");return p[2]+"."+p[1]+"."+p[0]}
function ex(name,note,sets,reps,rest,type,weight,step){return {id:uid(),name:name,note:note||"",sets:sets,reps:reps,rest:rest,weight:weight==null?null:weight,step:step==null?2.5:step,type:type||"normal"}}

function ssx(e){e.ss=true;return e}
function defaults(){
  return {v:6,updatedAt:0,cur:{c:1,w:1,d:"tue"},cycles:[{n:1,base:110,started:today()}],
    days:{
      tue:[ex("Жим лёжа","",0,"","3–4 мин","benchTue",null,0),
        ex("Жим гантелей на скамье 30°","вес одной гантели",3,"8–10","2 мин",null,28,2),
        ex("Тяга верхнего блока","средний хват: ширина плеч + ладонь",4,"8–10","2 мин",null,65,2.5),
        ex("Тяга гантели одной рукой с упором в скамью","рука и колено на скамье, спина ровная; вес одной",3,"10–12","1,5 мин",null,30,2),
        ex("Разгибание на трицепс","канат или прямая рукоять",3,"10–12","1,5 мин",null,30,2.5),
        ex("Подъём штанги на бицепс","спиной к стене, без раскачки",3,"8–10","1,5 мин",null,35,2.5),

        ex("Сгибание ног с гантелью лёжа","гантель зажата стопами, таз прижат к скамье",3,"10–12","1 мин",null,10,2),

var cfg=defaults(), sessions={};

/* Program update v2: start weights, progression step, 4 abs sets,
   flat dumbbell press on Thursday instead of the second incline press.
   Only touches exercises that still look like the original ones. */
var START={"жим на скамье 40°":[65,2.5],"тяга верхнего блока|широкий хват":[65,2.5],"тяга верхнего блока|узкий хват":[60,2.5],
  "разгибание на трицепс|tue":[30,2.5],"разгибание на трицепс|thu":[25,2.5],"подъём штанги на бицепс":[35,2.5],
  "подъёмы на икры|tue":[24,2],"подъёмы на икры|thu":[20,2],"тяга гантелей лёжа на наклонной 30–45°":[18,2],
  "разводка на плечи":[8,1],"подъём гантелей с супинацией":[14,2],"жим гантелей лёжа":[32,2]};
function migrate(c){
  if(!c||!c.days)return c;
  if((c.v||1)<2){
    ["tue","thu"].forEach(function(d){
      var list=c.days[d]||[];
      list.forEach(function(e){
        var n=String(e.name).toLowerCase();
        if(e.type==="benchTue"||e.type==="benchThu"){if(e.step==null)e.step=0;return}
        if(/^пресс/.test(n)){if((parseInt(e.sets,10)||0)<4)e.sets=4;e.step=0;return}
        var k=START[n+"|"+(e.note||"")]||START[n+"|"+d]||START[n];
        if(k){if(e.weight==null)e.weight=k[0];if(e.step==null)e.step=k[1]}
        if(e.step==null)e.step=/гантел/.test(n)?2:2.5;
        if(e.note==="начните с 16–20 кг")e.note="вес одной гантели";
      });
      if(d==="thu"&&!list.some(function(e){return /жим гантелей лёжа/i.test(e.name)})){
        var at=-1;list.forEach(function(e,i){if(at<0&&e.name==="Жим на скамье 40°"&&/легче/.test(e.note||""))at=i});
        var ne=ex("Жим гантелей лёжа","вес одной гантели, локти 45–60°",3,"8–10","2 мин",null,32,2);
        if(at>=0)list.splice(at,1,ne);else{var bi=list.findIndex(function(e){return e.type==="benchThu"});list.splice(bi+1,0,ne)}
      }
    });
    c.v=2;c.updatedAt=Date.now();
  }
  if(c.v<3){
    // v3: incline press with dumbbells, squeeze press on Tuesday, no dumbbell row on Thursday
    var tue=c.days.tue||[],thu=c.days.thu||[];
    tue.forEach(function(e){if(e.name==="Жим на скамье 40°"){e.name="Жим гантелей на скамье 40°";e.note="вес одной гантели";e.step=2;if(e.weight==null||e.weight>40)e.weight=30}});
    c.days.thu=thu.filter(function(e){return !/тяга гантелей лёжа/i.test(e.name)});
    if(!tue.some(function(e){return /свед|вместе/i.test(e.name)})){
      var pi=-1;tue.forEach(function(e,i){if(pi<0&&/тяга верхнего блока/i.test(e.name))pi=i});
      var sq=ex("Жим сведённых гантелей лёжа","гантели прижаты друг к другу всю амплитуду; вес одной",3,"10–12","1,5 мин",null,20,2);
      tue.splice(pi>=0?pi+1:Math.min(2,tue.length),0,sq);
    }
    c.v=3;c.updatedAt=Date.now();
  }
  if(c.v<4){
    // v4: 8 exercises per day, balanced pushing and pulling.
    // Tue: squeeze press -> one-arm dumbbell row. Thu: + face pull, - calves.
    var t4=c.days.tue||[];
    t4=t4.filter(function(e){return !/свед|вместе/i.test(e.name)});
    if(!t4.some(function(e){return /одной рукой/i.test(e.name)})){
      var pi4=-1;t4.forEach(function(e,i){if(pi4<0&&/тяга верхнего блока/i.test(e.name))pi4=i});
      t4.splice(pi4>=0?pi4+1:Math.min(3,t4.length),0,ex("Тяга гантели одной рукой с упором в скамью","рука и колено на скамье, спина ровная; вес одной",3,"10–12","1,5 мин",null,28,2));
    }
    c.days.tue=t4;
    var h4=(c.days.thu||[]).filter(function(e){return !/тяга гантелей лёжа/i.test(e.name)&&!/^подъёмы на икры/i.test(e.name)});
    if(!h4.some(function(e){return /к лицу|face pull/i.test(e.name)})){
      var qi=-1;h4.forEach(function(e,i){if(qi<0&&/тяга верхнего блока/i.test(e.name))qi=i});
      h4.splice(qi>=0?qi+1:Math.min(3,h4.length),0,ex("Тяга каната к лицу на верхнем блоке","face pull: локти высоко, разводите канат к ушам",3,"12–15","1 мин",null,20,2.5));
    }
    c.days.thu=h4;
    c.v=4;c.updatedAt=Date.now();
  }
  if(c.v<5){
    // v5: 30° press, lighter second press, lunges (Tue), overhead triceps + leg extension (Thu),
    // abs + calves superset at the end of both days, calves 3 sets.
    var isAbs=function(e){return /^пресс/i.test(e.name)},isCalf=function(e){return /^подъёмы на икры/i.test(e.name)};
    ["tue","thu"].forEach(function(d){
      var L=c.days[d]||[];
      L.forEach(function(e){
        if(/^жим гантелей на скамье 40°$/i.test(e.name)){e.name="Жим гантелей на скамье 30°";if(e.weight===30)e.weight=28}
        if(e.name==="Жим гантелей лёжа"&&e.weight===32)e.weight=30;
        if(/одной рукой/i.test(e.name)&&e.weight===28)e.weight=30;
        if(isCalf(e)&&(parseInt(e.sets,10)||0)>3){e.sets=3;if(e.reps==="10–15")e.reps="12–15"}
      });
      if(d==="thu"){
        L.forEach(function(e){if(e.name==="Разгибание на трицепс"){e.name="Разгибание из-за головы на верхнем блоке";e.note="канат, спиной к блоку, шаг вперёд, живот напряжён";e.reps="10–12";if(e.weight===25)e.weight=20}});
        if(!L.some(function(e){return /^разгибание ног/i.test(e.name)}))L.push(ex("Разгибание ног","вниз медленно, наверху без удара в замок",3,"12–15","1 мин",null,45,2.5));
        if(!L.some(isCalf))L.push(ex("Подъёмы на икры","гантели в руках, вес одной",3,"12–15","1 мин",null,20,2));
      }else{
        if(!L.some(function(e){return /выпад/i.test(e.name)}))L.push(ex("Выпады назад с гантелями","вес одной гантели; на каждую ногу, корпус прямой",3,"8–10","1,5 мин",null,14,2));
      }
      // order: everything else, then abs (superset) then calves
      var abs=L.filter(isAbs),calf=L.filter(isCalf),rest=L.filter(function(e){return !isAbs(e)&&!isCalf(e)});
      abs.forEach(function(e){e.ss=true;e.rest="сразу икры"});
      c.days[d]=rest.concat(abs,calf);
    });
    c.v=5;c.updatedAt=Date.now();
  }
  if(c.v<6){
    // v6: dumbbell leg curl on Tuesday, medium / neutral grip pulldowns, laterals and calves 4 sets
    ["tue","thu"].forEach(function(d){
      var L=c.days[d]||[];
      L.forEach(function(e){
        if(e.name==="Тяга верхнего блока"&&e.note==="широкий хват")e.note="средний хват: ширина плеч + ладонь";
        if(e.name==="Тяга верхнего блока"&&e.note==="узкий хват")e.note="нейтральный хват: V-рукоять, ладони друг к другу";
        if((/^разводка на плечи/i.test(e.name)||/^подъёмы на икры/i.test(e.name))&&(parseInt(e.sets,10)||0)<4)e.sets=4;
      });
      if(d==="tue"&&!L.some(function(e){return /сгибание ног/i.test(e.name)})){
        var at=-1;L.forEach(function(e,i){if(/выпад/i.test(e.name))at=i});
        if(at<0)L.forEach(function(e,i){if(at<0&&e.ss)at=i-1});
        L.splice(at>=0?at+1:L.length,0,ex("Сгибание ног с гантелью лёжа","гантель зажата стопами, таз прижат к скамье",3,"10–12","1 мин",null,10,2));
      }
    });
    c.v=6;c.updatedAt=Date.now();
  }
  return c;
}

/* ---------- storage ---------- */
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify({cfg:cfg,sessions:sessions}))}catch(e){}}
function persist(id,data){
  cacheLocal();
  if(mode!=="db")return;
  clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){
    var body=JSON.parse(JSON.stringify(data));
    chains[id]=(chains[id]||Promise.resolve()).then(function(){return col.doc(id).set(body)}).catch(function(){toast("Не удалось сохранить. Проверьте интернет.")});
  },600);
}
function saveCfg(){cfg.updatedAt=Date.now();persist("config",cfg)}
function saveSess(k){persist(k,sessions[k])}

function connect(){
  if(!window.claude||!window.claude.use){render();return}
  Promise.all([window.claude.use("user"),window.claude.use("db")]).then(function(r){
    var user=r[0],db=r[1];
    if(!user||!db)return null;
    return user.id().then(function(id){
      if(!id)return null;
      var c=db.collection("data/users/"+id);
      var t;var to=new Promise(function(_,rej){t=setTimeout(function(){rej(new Error("timeout"))},10000)});
      return Promise.race([c.get(),to]).then(function(snap){clearTimeout(t);return {c:c,snap:snap}});
    });
  }).then(function(res){
    if(!res){render();return}
    col=res.c;mode="db";
    var remoteCfg=null,remoteS={};
    res.snap.docs.forEach(function(d){var b=d.data();if(!b)return;if(d.id==="config")remoteCfg=JSON.parse(JSON.stringify(b));else if(d.id.indexOf("s_")===0)remoteS[d.id]=JSON.parse(JSON.stringify(b))});
    if(remoteCfg&&(remoteCfg.updatedAt||0)>=(cfg.updatedAt||0)){
      var wasV=remoteCfg.v||1;cfg=migrate(remoteCfg);if(wasV<6)persist("config",cfg);
      Object.keys(remoteS).forEach(function(k){sessions[k]=remoteS[k]});
      cacheLocal();
    }else{
      persist("config",cfg);
      Object.keys(sessions).forEach(function(k){persist(k,sessions[k])});
    }
    render();
  }).catch(function(){mode="local";render()});
}

/* ---------- model helpers ---------- */
function cyc(n){for(var i=0;i<cfg.cycles.length;i++)if(cfg.cycles[i].n===n)return cfg.cycles[i];return cfg.cycles[cfg.cycles.length-1]}
function key(c,w,d){return "s_c"+c+"w"+w+d}
function curKey(){return key(cfg.cur.c,cfg.cur.w,cfg.cur.d)}
function sess(k,create){if(!sessions[k]&&create){var p=/s_c(\d+)w(\d)(\w+)/.exec(k);sessions[k]={c:+p[1],w:+p[2],d:p[3],ex:{},test:{},doneAt:null}}return sessions[k]}
function isBench(e){return e.type==="benchTue"||e.type==="benchThu"}
function scheme(e){return BENCH[e.type][cfg.cur.w-1]}
function setCount(e){if(isBench(e)){var s=scheme(e);return s.test?1:s.s}return Math.max(1,parseInt(e.sets,10)||1)}
function exLog(s,id){return s&&s.ex&&s.ex[id]}
function exDone(s,e){var l=exLog(s,e.id),n=setCount(e);if(!l||!l.s)return false;for(var i=0;i<n;i++)if(!l.s[i])return false;return true}
function dayDone(c,w,d){var s=sessions[key(c,w,d)];return !!(s&&s.doneAt)}

function viewCard(e,i,s,base){

/* ---------- weight progression ---------- */
// Bench sets of weeks 3-4 (both days) in a cycle: mostly easy / any repeated hard.
function benchFeel(cn){
  var ez=0,hd=0,tot=0;
  [3,4].forEach(function(w){["tue","thu"].forEach(function(d){var s=sessions[key(cn,w,d)];if(!s||!s.ex)return;
    cfg.days[d].forEach(function(e){if(!isBench(e))return;var l=s.ex[e.id];if(!l||!l.s)return;
      l.s.forEach(function(on,q){if(!on)return;tot++;var r=(l.r&&l.r[q])||"n";if(r==="e")ez++;if(r==="h")hd++})})})});
  if(!tot)return null;if(hd>=2)return "hard";if(ez>=tot*.75)return "easy";return "ok";
}
function hasW(e){return !isBench(e)&&(e.step==null||e.step>0)}
function dispW(e,l,pl){if(l&&l.w!=null)return l.w;if(pl)return pl.kg;return e.weight}
function roundStep(v,st){return Math.max(st,Math.round(v/st)*st)}
// Double progression from the history before the current session:
// all sets done + "легко" -> +step; two sessions in a row all done at the same weight (not "тяжело") -> +step;
// not all sets done twice in a row at the same weight -> -10%.
function plan(e){
  if(!hasW(e))return null;
  var st=e.step||2.5,c=cfg.cur,cur=[c.c,c.w,DORD[c.d]],hist=[];
  orderedSessions().forEach(function(s){
    var pos=[s.c,s.w,DORD[s.d]];if(pos[0]>cur[0]||(pos[0]===cur[0]&&(pos[1]>cur[1]||(pos[1]===cur[1]&&pos[2]>=cur[2]))))return;
    if(s.w===5)return; // deload week does not count
    var l=s.ex&&s.ex[e.id];if(!l||l.w==null)return;var n=Math.max(1,parseInt(e.sets,10)||1),dn=doneSets(l,n);if(!dn)return;
    var ez=0,hd=0;for(var q=0;q<n;q++){if(!(l.s&&l.s[q]))continue;var rr=(l.r&&l.r[q])||(l.f==="e"?"e":l.f==="h"?"h":"n");if(rr==="e")ez++;else if(rr==="h")hd++}
    hist.push({w:l.w,all:dn>=n,n:n,ez:ez,hd:hd});
  });
  if(!hist.length){if(c.w===5&&e.weight)return {kg:roundStep(e.weight*.7,st),why:"Разгрузка — на 30% легче"};return null}
  var L=hist[hist.length-1];
  if(c.w===5)return {kg:roundStep(L.w*.7,st),why:"Разгрузка — на 30% легче"};
  var P=hist.length>1?hist[hist.length-2]:null;
  var bad=function(x){return !x.all||x.hd>=2};
  if(bad(L)){
    if(P&&bad(P)&&P.w===L.w)return {kg:roundStep(L.w*.9,st),why:"Два раза подряд тяжело — снизить на 10%"};
    return {kg:L.w,why:L.all?"Было тяжело — повторить вес":"Не все подходы — повторить вес"};
  }
  if(L.hd===1)return {kg:L.w,why:"Один подход тяжело — повторить вес"};
  if(L.ez===L.n)return {kg:roundStep(L.w+st,st),why:"Все подходы легко — прибавить"};
  if(L.ez*2>=L.n)return {kg:roundStep(L.w+st,st),why:"Больше половины легко — прибавить"};
  if(P&&P.all&&P.hd===0&&P.w===L.w)return {kg:roundStep(L.w+st,st),why:"Два раза всё нормально — прибавить"};
  return {kg:L.w,why:"Всё нормально — закрепить вес"};
}

/* ---------- dumbbell suggestions ---------- */
// Per-hand dumbbell weight for ~10 reps as a share of the barbell bench max.
var DB_RULES=[
  {test:function(n){return /жим/.test(n)&&/(наклон|30°|40°|45°|30-45|30–45)/.test(n)},k:.25,label:function(n){return /гантел/.test(n)?"Совет":"Если гантелями"}},
  {test:function(n){return /жим/.test(n)&&/(свед|вместе)/.test(n)},k:.18,label:function(){return "Совет"}},
  {test:function(n){return /жим/.test(n)&&/гантел/.test(n)},k:.29,label:function(){return "Совет"}},
  {test:function(n){return /развод/.test(n)&&/плеч|стороны|дельт/.test(n)},k:.07,label:function(){return "Совет"}},
  {test:function(n){return /махи/.test(n)},k:.07,label:function(){return "Совет"}},
  {test:function(n){return /развод/.test(n)},k:.12,label:function(){return "Совет"}},
  {test:function(n){return /тяга/.test(n)&&/гантел/.test(n)&&/одной рукой/.test(n)},k:.25,label:function(){return "Совет"}},
  {test:function(n){return /тяга/.test(n)&&/гантел/.test(n)},k:.17,label:function(){return "Совет"}},
  {test:function(n){return /француз/.test(n)&&/гантел/.test(n)},k:.14,label:function(){return "Совет"}},
  {test:function(n){return /гантел/.test(n)&&/(бицепс|супинац|молот)/.test(n)},k:.12,label:function(){return "Совет"}}
];
function dbSuggest(e,base){
  var n=String(e.name).toLowerCase();
  for(var i=0;i<DB_RULES.length;i++){var r=DB_RULES[i];if(r.test(n)){
    var reps=parseInt(String(e.reps),10)||10;var adj=Math.max(.75,Math.min(1.15,1-(reps-10)*.035));
    var kg=Math.max(2,Math.round(base*r.k*adj/2)*2);
    return {kg:kg,label:r.label(n)};
  }}
  return null;
}

/* ---------- stats ---------- */
var DORD={tue:0,thu:1};
function orderedSessions(){return Object.keys(sessions).map(function(k){return sessions[k]}).sort(function(a,b){return a.c-b.c||a.w-b.w||DORD[a.d]-DORD[b.d]})}
function exById(id){var all=cfg.days.tue.concat(cfg.days.thu);for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];return null}
function doneSets(l,n){var k=0;if(l&&l.s)for(var i=0;i<n;i++)if(l.s[i])k++;return k}
function sessStats(s){
  var ton=0,sets=0,base=cyc(s.c).base;
  Object.keys(s.ex||{}).forEach(function(id){
    var e=exById(id),l=s.ex[id];if(!e)return;
    if(isBench(e)){var sc=BENCH[e.type][s.w-1];
      if(sc.test){var t=s.test||{};var d1=doneSets(l,1);sets+=d1;if(d1&&t.w&&t.r)ton+=t.w*t.r;return}
      var d=doneSets(l,sc.s);sets+=d;ton+=d*sc.r*r25(base*sc.p);return}
    var n=Math.max(1,parseInt(e.sets,10)||1),dd=doneSets(l,n);sets+=dd;
    var w=l.w!=null?l.w:null,reps=parseInt(String(e.reps),10);
    if(dd&&w&&reps)ton+=dd*reps*w;
  });
  return {ton:ton,sets:sets};
}
function tons(x){return x>=1000?fmt(Math.round(x/100)/10)+' т':fmt(Math.round(x))+' кг'}
function sessLabel(s){return 'Ц'+s.c+' Н'+s.w+' '+DAYS[s.d]}

function barChart(items,unit){
  // items: [{k,label,v,txt}]
  var W=340,H=170,pl=8,pr=8,pt=22,pb=26,n=items.length;
  var max=0;items.forEach(function(it){if(it.v>max)max=it.v});if(!max)max=1;
  var step=(W-pl-pr)/n,bw=Math.min(28,step*.62),o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(unit)+'">';
  o+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  var sel=ui.selBar,selIt=null;
  items.forEach(function(it,i){
    var h=Math.max(2,(H-pt-pb)*it.v/max),x=pl+step*i+(step-bw)/2,y=H-pb-h,isSel=sel===it.k||(!sel&&i===n-1);
    if(isSel)selIt=it;
    o+='<path class="bar'+(isSel?' sel':'')+'" d="M'+x+' '+(H-pb)+'V'+(y+4)+'q0 -4 4 -4h'+(bw-8)+'q4 0 4 4V'+(H-pb)+'Z"/>';
    if(isSel)o+='<text class="val" x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle">'+esc(it.txt)+'</text>';
    if(n<=8||i%Math.ceil(n/8)===0||i===n-1)o+='<text class="axis" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.label)+'</text>';
    o+='<rect class="hit" data-act="bar" data-k="'+esc(it.k)+'" x="'+(pl+step*i)+'" y="0" width="'+step+'" height="'+H+'"><title>'+esc(it.full||it.label)+': '+esc(it.txt)+'</title></rect>';
  });
  return {svg:o+'</svg>',sel:selIt};
}

function spark(vals){
  if(vals.length<2)return '<svg class="spark" viewBox="0 0 72 26" aria-hidden="true"></svg>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1,pts=vals.map(function(v,i){return (3+i*(66/(vals.length-1))).toFixed(1)+','+(22-(v-mn)/rg*18).toFixed(1)});
  var last=pts[pts.length-1].split(',');
  return '<svg class="spark" viewBox="0 0 72 26" aria-hidden="true"><polyline points="'+pts.join(' ')+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3"/></svg>';
}

function statsHTML(){
  var all=orderedSessions(),active=[],done=0,totSets=0,totTon=0,last=null;
  all.forEach(function(s){var st=sessStats(s);if(s.doneAt){done++;if(!last||s.doneAt>last)last=s.doneAt}if(st.sets||s.doneAt){active.push({s:s,st:st})}totSets+=st.sets;totTon+=st.ton});
  var lastC=cfg.cycles[cfg.cycles.length-1],planned=0,doneCur=0;

  // bench max by cycle

  o+='<div class="panel"><h3>Максимум в жиме</h3>';

    var bc=barChart(mx.map(function(m){return {k:'c'+m.n,label:'Ц'+m.n,full:'Цикл '+m.n,v:m.base,txt:fmt(m.base)+' кг'}}),'Максимум по циклам');
    o+=bc.svg;
    var first=mx[0].base,lastB=mx[mx.length-1].base;o+='<p class="cap">С начала: '+fmt(first)+' → '+fmt(lastB)+' кг ('+(lastB-first>=0?'+':'')+fmt(lastB-first)+' кг). Нажмите на столбик, чтобы увидеть значение.</p>';
  }else{
    o+='<div class="tile" style="padding:0"><b>'+fmt(mx[0].base)+' кг</b><span>максимум цикла 1. График появится, когда начнёте цикл 2.</span></div>';
  }
  var ests=mx.filter(function(m){return m.est});
  if(ests.length)o+='<p class="cap">Проверки на 6-й неделе: '+ests.map(function(m){return 'цикл '+m.n+' ≈ '+fmt(m.est)+' кг'}).join(', ')+'.</p>';
  o+='</div>';
  // tonnage per workout
  var recent=active.slice(-12);
  var tc=barChart(recent.map(function(a){return {k:sessLabel(a.s),label:'Н'+a.s.w+DAYS[a.s.d].charAt(0),full:sessLabel(a.s),v:a.st.ton,txt:tons(a.st.ton)}}),'Объём по тренировкам');
  o+='<div class="panel"><h3>Объём по тренировкам</h3>'+tc.svg+'<p class="cap">'+(tc.sel?(tc.sel.full+': '+tc.sel.txt+', подходов: '+(recent.filter(function(a){return sessLabel(a.s)===tc.sel.k})[0]||{st:{sets:0}}).st.sets):'')+'. Последние '+recent.length+' тренировок, подпись: неделя и день (В — вторник, Ч — четверг).</p></div>';
  // per exercise progression
  var rows='';
  ["tue","thu"].forEach(function(d){cfg.days[d].forEach(function(e){

    var vals=[];all.forEach(function(s){var l=s.ex&&s.ex[e.id];if(l&&l.w!=null&&doneSets(l,Math.max(1,parseInt(e.sets,10)||1)))vals.push(l.w)});
    if(!vals.length)return;
    var dlt=vals[vals.length-1]-vals[0];
    rows+='<div class="exrow"><div class="nm">'+esc(e.name)+'<small>'+DAYS[d]+' · '+vals.length+' трен. · сейчас '+fmt(vals[vals.length-1])+' кг</small></div>'+spark(vals)+'<div class="dl'+(dlt>0?' up':'')+'">'+(dlt>0?'+':'')+fmt(dlt)+' кг</div></div>';
  })});
  o+='<div class="panel"><h3>Рост весов</h3>'+(rows||'<p class="cap">Появится, когда отметите подходы с указанным весом.</p>')+'</div>';

  o+='<div class="panel"><h3>Последние тренировки</h3>'+lg+'</div>';
  return o;
}

/* ---------- actions ---------- */
function isSSnext(e){var l=cfg.days[cfg.cur.d];for(var i=1;i<l.length;i++)if(l[i]===e&&l[i-1].ss)return true;return false}
function findEx(id){var l=cfg.days[cfg.cur.d];for(var i=0;i<l.length;i++)if(l[i].id===id)return {e:l[i],i:i,l:l};return null}
function logFor(id,create){var s=sess(curKey(),create);if(!s)return null;s.ex=s.ex||{};if(!s.ex[id]&&create)s.ex[id]={s:[],w:null};return s.ex[id]}
function go(c,w,d){cfg.cur={c:c,w:w,d:d};ui.delArm=null;saveCfg();render();window.scrollTo(0,0)}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.dataset.act,id=b.dataset.id,c=cfg.cur,f,l;
  if(a!=="del")ui.delArm=null;
  if(a!=="reset")ui.resetArm=false;
  switch(a){
    case "edit":ui.edit=!ui.edit;ui.stats=false;break;
    case "stats":ui.stats=true;ui.edit=false;ui.selBar=null;window.scrollTo(0,0);break;
    case "bar":ui.selBar=b.dataset.k;break;
    case "usesug":f=findEx(id);if(!f)return;l=logFor(id,true);l.w=+b.dataset.kg;f.e.weight=l.w;saveSess(curKey());saveCfg();break;
    case "settings":ui.settings=true;ui.hlCycle=false;break;
    case "close":ui.settings=false;ui.backup=null;break;
    case "export":
      ui.backup="export";render();var ta=document.getElementById("bkOut");
      try{navigator.clipboard.writeText(ta.value).then(function(){toast("Данные скопированы")},function(){ta.select();toast("Выделите текст и скопируйте его")})}catch(e){ta.select();toast("Выделите текст и скопируйте его")}
      return;
    case "importShow":ui.backup="import";break;
    case "import":
      var d=null;try{d=JSON.parse(document.getElementById("bkIn").value)}catch(e){}
      if(!d||!d.cfg||!d.cfg.days||!d.cfg.cycles){toast("Это не похоже на данные приложения");return}
      cfg=migrate(d.cfg);sessions=d.sessions||{};saveCfg();Object.keys(sessions).forEach(saveSess);ui.backup=null;ui.settings=false;toast("Данные загружены");break;
    case "cprev":return go(c.c-1,1,"tue");
    case "cnext":return go(c.c+1,1,"tue");
    case "week":ui.stats=false;return go(c.c,+b.dataset.w,c.d);
    case "day":ui.stats=false;return go(c.c,c.w,b.dataset.d);
    case "goto":ui.settings=false;return go(+b.dataset.c,+b.dataset.w,b.dataset.d);
    case "set":
      f=findEx(id);if(!f)return;l=logFor(id,true);l.s=l.s||[];var i=+b.dataset.i;l.s[i]=!l.s[i];
      if(!isBench(f.e)&&l.w==null&&hasW(f.e)){var dw=dispW(f.e,null,plan(f.e));if(dw!=null){l.w=dw;f.e.weight=dw;saveCfg()}}
      saveSess(curKey());
      l.r=l.r||[];if(l.s[i]){l.r[i]=l.r[i]||"n";ui.rate={id:id,i:i}}else{l.r[i]=null;if(ui.rate&&ui.rate.id===id)ui.rate=null}
      saveSess(curKey());
      if(l.s[i]&&!exDone(sess(curKey()),f.e))startRest(f.e);
      break;
    case "rate":l=logFor(id,true);l.r=l.r||[];l.r[+b.dataset.i]=b.dataset.f;ui.rate=null;saveSess(curKey());break;
    case "rest":f=findEx(id);if(f)startRest(f.e);break;
    case "feel":l=logFor(id,true);l.f=(l.f===b.dataset.f)?null:b.dataset.f;saveSess(curKey());break;
    case "rplus":if(timer){timer.end+=30000;timer.total+=30;saveTimer()}refreshTimer(true);return;
    case "rstop":timer=null;saveTimer();refreshTimer(true);return;
    case "pill":
      if(!timer)return;
      if(timer.d!==cfg.cur.d||ui.stats){ui.stats=false;cfg.cur.d=timer.d;render()}
      var el=document.getElementById("rt-"+timer.id);if(el)el.scrollIntoView({block:"center",behavior:"smooth"});return;
    case "wplus":case "wminus":
      f=findEx(id);if(!f)return;l=logFor(id,true);var v=(l.w!=null?l.w:dispW(f.e,null,plan(f.e)))||0,stp=f.e.step||2.5;v=Math.max(0,Math.round((v+(a==="wplus"?stp:-stp))*100)/100);l.w=v;f.e.weight=v;saveSess(curKey());saveCfg();break;
    case "finish":var s=sess(curKey(),true);s.doneAt=today();saveSess(curKey());toast(DAYN[c.d]+", неделя "+c.w+": выполнено");break;
    case "undone":sessions[curKey()].doneAt=null;saveSess(curKey());break;
    case "next":
      if(c.d==="tue")return go(c.c,c.w,"thu");
      if(c.w<6)return go(c.c,c.w+1,"tue");
      if(c.c<cfg.cycles.length)return go(c.c+1,1,"tue");
      ui.settings=true;ui.hlCycle=true;break;
    case "up":case "down":
      f=findEx(id);if(!f)return;var j=f.i+(a==="up"?-1:1);if(j<0||j>=f.l.length)return;var tmp=f.l[j];f.l[j]=f.e;f.l[f.i]=tmp;saveCfg();break;
    case "del":
      if(ui.delArm!==id){ui.delArm=id;break}
      f=findEx(id);if(f){f.l.splice(f.i,1);saveCfg()}ui.delArm=null;break;
    case "add":
      var ne=ex("Новое упражнение","",3,"10–12","1,5 мин");cfg.days[c.d].push(ne);saveCfg();render();
      var inp=root.querySelector('[data-in="name"][data-id="'+ne.id+'"]');if(inp){inp.focus();inp.select()}return;
    case "newcycle":
      var nb=num(document.getElementById("newBase").value);if(!nb||nb<20){toast("Введите максимум в кг, например 112,5");return}
      var last=cfg.cycles[cfg.cycles.length-1];cfg.cycles.push({n:last.n+1,base:nb,started:today()});ui.settings=false;ui.hlCycle=false;
      toast("Цикл "+(last.n+1)+" начат, максимум "+fmt(nb)+" кг");return go(last.n+1,1,"tue");
    case "reset":
      if(!ui.resetArm){ui.resetArm=true;break}
      var old=Object.keys(sessions);cfg=defaults();sessions={};ui.resetArm=false;ui.settings=false;saveCfg();
      if(mode==="db")old.forEach(function(k){clearTimeout(timers[k]);chains[k]=(chains[k]||Promise.resolve()).then(function(){return col.doc(k).delete()}).catch(function(){})});
      cacheLocal();toast("Данные сброшены");break;
  }
  render();
});

document.addEventListener("input",function(ev){
  var t=ev.target,k=t.dataset&&t.dataset.in;if(!k)return;
  var id=t.dataset.id,f;
  if(k==="w"){f=findEx(id);if(!f)return;var v=num(t.value);var l=logFor(id,true);l.w=v;f.e.weight=v;saveSess(curKey());saveCfg();return}
  if(k==="tw"||k==="tr"){var s=sess(curKey(),true);s.test=s.test||{};s.test[k==="tw"?"w":"r"]=num(t.value);saveSess(curKey());var e=document.getElementById("est");if(e)e.textContent=estText(s.test);return}
  if(k==="base"){var b=num(t.value);if(b&&b>=20){cyc(cfg.cur.c).base=b;saveCfg()}return}
  f=findEx(id);if(!f)return;
  if(k==="ss"){f=findEx(id);if(!f)return;f.e.ss=t.checked;saveCfg();return}
  if(k==="sets"){var n=parseInt(t.value,10);if(n>=1&&n<=12)f.e.sets=n}else if(k==="step"){var st=num(t.value);if(st!=null&&st>=0&&st<=20)f.e.step=st}else f.e[k]=t.value;
  saveCfg();
});
document.addEventListener("change",function(ev){if(ev.target.dataset&&ev.target.dataset.in==="base")render()});

/* ---------- rest timer ---------- */
var timer=null,TK="zhim-timer";
try{timer=JSON.parse(localStorage.getItem(TK)||"null")}catch(e){}
function saveTimer(){try{if(timer)localStorage.setItem(TK,JSON.stringify(timer));else localStorage.removeItem(TK)}catch(e){}}
function restSecs(e){
  var t=String(e.rest||"").toLowerCase().replace(",",".");
  var m=t.match(/(\d+(?:\.\d+)?)/);if(!m)return 90;
  var v=parseFloat(m[1]);
  if(/мин|min|м\b/.test(t))return Math.round(v*60);
  if(/с|сек|s/.test(t))return Math.round(v);
  return v<=10?Math.round(v*60):Math.round(v);
}
function mmss(sec){sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}
var CLOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>';
function rtInner(e){
  if(e.ss)return '<span class="sstag">Суперсет ↓ без отдыха — сразу к следующему упражнению</span>';
  if(timer&&timer.id===e.id){
    var rem=(timer.end-Date.now())/1000;
    if(rem>0)return '<span class="tm" data-tm>'+mmss(rem)+'</span><span class="mid"><span>из '+mmss(timer.total)+'</span><span class="trk"><i data-fill style="width:'+Math.max(0,Math.min(100,rem/timer.total*100))+'%"></i></span></span><button data-act="rplus" aria-label="Добавить 30 секунд">+30 с</button><button data-act="rstop">Стоп</button>';
    return '';
  }
  return '<button class="rtb" data-act="rest" data-id="'+e.id+'">'+CLOCK+'Отдых '+mmss(restSecs(e))+'</button>';
}
var FIN='<span>Отдых окончен — следующий подход</span><button data-act="rstop">OK</button>';
var actx=null;
function audioPrime(){try{if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;var t=actx.currentTime;[0,.28,.56].forEach(function(d,i){var o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.24)})}catch(e){}}
var wl=null;function wakeOn(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request("screen").then(function(x){wl=x;x.addEventListener("release",function(){wl=null})}).catch(function(){})}catch(e){}}
function wakeOff(){try{if(wl){wl.release();wl=null}}catch(e){}}
function startRest(e){if(e.ss){toast("Суперсет: сразу следующее упражнение");return}audioPrime();timer={id:e.id,d:cfg.cur.d,name:e.name,end:Date.now()+restSecs(e)*1000,total:restSecs(e),fired:false};saveTimer();wakeOn();refreshTimer(true)}
function finishRest(){
  timer.fired=true;saveTimer();beep();
  try{if(navigator.vibrate)navigator.vibrate([350,150,350,150,350])}catch(e){}
  wakeOff();
  var el=document.getElementById("rt-"+timer.id);
  if(el){el.className="rt fin";el.innerHTML=FIN}
  var pill=document.getElementById("pill");pill.className="pill fin";pill.textContent="Пора!";
  var id=timer.id;setTimeout(function(){if(timer&&timer.id===id&&timer.fired){timer=null;saveTimer();refreshTimer(true)}},20000);
}
function refreshTimer(full){
  // rebuild every card's timer block (cheap) when the timer starts/stops
  if(full){document.querySelectorAll(".rt").forEach(function(el){var id=el.id.slice(3),f=findEx(id);if(!f)return;var on=timer&&timer.id===id&&!timer.fired,fin=timer&&timer.id===id&&timer.fired;el.className="rt"+(on?" on":"")+(fin?" fin":"");el.innerHTML=fin?FIN:rtInner(f.e)})}
  tick();
}
function tick(){
  var pill=document.getElementById("pill");
  if(!timer){pill.hidden=true;return}
  var rem=(timer.end-Date.now())/1000;
  if(timer.fired){pill.hidden=false;pill.className="pill fin";pill.textContent="Пора!";return}
  if(rem<=0){finishRest();pill.hidden=false;return}
  pill.hidden=false;pill.className="pill";pill.innerHTML=CLOCK.replace('aria-hidden','style="width:18px;height:18px" aria-hidden')+mmss(rem);
  var el=document.getElementById("rt-"+timer.id);
  if(el){var tm=el.querySelector("[data-tm]"),fl=el.querySelector("[data-fill]");if(tm)tm.textContent=mmss(rem);if(fl)fl.style.width=Math.max(0,rem/timer.total*100)+"%"}
}
setInterval(tick,250);window.__rt=true;
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});

var tt;function toast(m){var el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},2600)}

window.__back=function(){if(ui.settings){ui.settings=false;ui.backup=null;render();return true}if(ui.stats){ui.stats=false;render();return true}if(ui.edit){ui.edit=false;render();return true}return false};
render();refreshTimer(true);
setTimeout(connect,0);
})();
</script>

</body></html>
